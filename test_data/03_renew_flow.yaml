# ============================================================
# 3. 换房续钟流程 (开台 → 换房 → 续钟 → 结账 → 反结账 → 取消开台)
# ============================================================

- feature: 换房续钟流程
  story: 换房续钟流程
  tests:

    # ── 开台含商品 ──
    - id: renew_flow_open
      title: '[开台-正向] 开台含商品'
      method: POST
      path: /cashier/order/store
      data:
        box_id: '{{ BOX_ID_NEW }}'
        billing_type: '10'
        goods_pricing_schemes_id: '7'
        box_pricing_schemes_id: '4'
        purchase_time: '0'
        shop_user_sales_id: '{{ GIVE_USER_ID }}'
        shop_user_waiter_id: ''
        user_vip_id: ''
        sales_name: 自动化测试
        remark: 我是备注
        goods_array:
          - goods_id: 15
            goods_name: 国宾啤酒
            num: 5
            unit_name: 瓶
            unit_id: 38
            type: 1
          - goods_id: 16
            goods_name: 可乐
            num: 5
            unit_name: 听
            unit_id: 47
            type: 1
        box_period_pricing_scheme_id: '4'
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
      special: renew_flow_open

    # ── 换房 ──
    - id: renew_flow_exchange
      title: '[换房-正向] 换房'
      method: POST
      path: /cashier/exchangehouses/setexchangehouses
      data:
        box_id: '{{ BOX_ID_NEW }}'
        target_box_id: '{{ BOX_ID_NEW }}'
        billing_type: '10'
        goods_pricing_schemes_id: '7'
        box_period_pricing_scheme_id: '4'
        remark: ''
        purchase_time: '120'
        opening_scheme: '1'
        shop_user_sales_id: '{{ GIVE_USER_ID }}'
        shop_user_waiter_id: '0'
        goods_array:
          - goods_id: 15
            goods_name: 国宾啤酒
            num: 5
            unit_name: 瓶
            unit_id: 38
            type: 1
          - goods_id: 16
            goods_name: 可乐
            num: 5
            unit_name: 听
            unit_id: 47
            type: 1
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1

    # ── 续钟 (依赖: order_id) ──
    - id: renew_flow_continue
      title: '[续钟-正向] 续钟'
      method: POST
      path: /cashier/order/store
      data:
        box_id: '{{ BOX_ID_NEW }}'
        billing_type: '10'
        goods_pricing_schemes_id: '7'
        box_pricing_schemes_id: '4'
        purchase_time: '0'
        shop_user_sales_id: '{{ GIVE_USER_ID }}'
        shop_user_waiter_id: '0'
        goods_array:
          - goods_id: 15
            goods_name: 国宾啤酒
            num: 5
            unit_name: 瓶
            unit_id: 38
            type: 1
          - goods_id: 16
            goods_name: 可乐
            num: 5
            unit_name: 听
            unit_id: 47
            type: 1
        order_id: '{{ order_id }}'
        box_period_pricing_scheme_id: '4'
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1

    # ── 结账 (产出: order_payment_id) ──
    - id: renew_flow_settle
      title: '[结账-正向] 结账'
      method: POST
      path: /cashier/orderpayments/setsettlement
      data:
        box_id: '{{ BOX_ID_NEW }}'
        type: '0'
        payRemark: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
      extract:
        order_payment_id: data.order_payment_id
      special: renew_flow_settle

    # ── 反结账 ──
    - id: renew_flow_cancel_settle
      title: '[反结账-正向] 反结账'
      method: POST
      path: /cashier/order/setcancelclosing
      data:
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
      special: renew_flow_cancel

    # ── 取消开台 ──
    - id: renew_flow_cancel_open
      title: '[取消开台-正向] 取消开台'
      method: POST
      path: /cashier/order/editboxstatus
      data:
        box_status: '10'
        box_id: '{{ BOX_ID_NEW }}'
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
