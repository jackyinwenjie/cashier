# ============================================================
# 2. 收银流程 (开台 → 点单 → 退品 → 赠送 → 结算 → 关房)
# ============================================================

- feature: 收银流程
  story: 收银流程
  tests:

    # ── 开台 ──
    - id: open_table
      title: '[开台-正向] 开台'
      method: POST
      path: /cashier/order/store
      data:
        box_id: '{{ BOX_ID }}'
        billing_type: '20'
        goods_pricing_schemes_id: '7'
        box_pricing_schemes_id: '21'
        purchase_time: '480'
        shop_user_sales_id: ''
        shop_user_waiter_id: ''
        user_vip_id: ''
        sales_name: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
      special: websocket_open_table

    # ── 点单 ──
    - id: add_goods
      title: '[点单-正向] 点单'
      method: POST
      path: /cashier/goodsorders/store
      data:
        box_id: '{{ BOX_ID }}'
        shop_user_sales_id: ''
        goods_array:
          - goods_id: 15
            goods_name: 国宾啤酒
            num: 2
            unit_name: 瓶
            unit_id: 38
            type: 1
          - goods_id: 16
            goods_name: 可乐
            num: 2
            unit_name: 听
            unit_id: 47
            type: 1
        desc: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
      special: add_goods_extract

    # ── 退品 (依赖: order_id) ──
    - id: goods_refund
      title: '[退品-正向] 退品'
      method: POST
      path: /cashier/order/goods_refund_save
      data:
        order_id: '{{ order_id }}'
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
      special: goods_refund_param

    # ── 赠送 ──
    - id: give_order
      title: '[赠送-正向] 赠送商品'
      method: POST
      path: /cashier/goodsorders/store
      data:
        box_id: '{{ BOX_ID }}'
        give_id: '{{ GIVE_USER_ID }}'
        goods_array:
          - goods_id: 15
            goods_name: 国宾啤酒
            num: 1
            unit_name: 瓶
            unit_id: 38
            type: 1
        send_remark: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功

    # ── 单品结算 ──
    - id: good_settlement
      title: '[付款-正向] 单品结算'
      method: POST
      path: /cashier/orderpayments/goodSettlement
      data:
        box_id: '{{ BOX_ID }}'
        type: '0'
        payRemark: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
      special: settlement_param

    # ── 整体结账 ──
    - id: set_settlement
      title: '[结账-正向] 整体结账'
      method: POST
      path: /cashier/orderpayments/setsettlement
      data:
        box_id: '{{ BOX_ID }}'
        type: '1'
        payRemark: ''
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
      special: set_settlement_param

    # ── 关房 ──
    - id: close_box
      title: '[关房-正向] 关房'
      method: POST
      path: /cashier/order/editboxstatus
      data:
        box_status: '50'
        box_id: '{{ BOX_ID }}'
        shop_id: '{{ SHOP_ID }}'
      assert:
        code: 1
        msg: 成功
