      method: POST
      path: /cashier/user/vip/deduction
      data:
        money: '1000'
        gift: '1000'
        remark: 自动化扣款
        id: '{{ VIP_ID }}'
        pay_ways:
          - id: '37'
            money: '1000'
            type: '3'
