- feature: 基础数据
  story: 基础数据
  tests:
  - id: userdata
    title: '[用户-正向] 获取收银员信息'
    method: GET
    path: /shop/userdata
    data:
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      data.id: exists
      data.name: exists
      data.account: exists
      data.cashier_version: exists
    extract: {}
    sign: true
  - id: shop_datalist
    title: '[店铺-正向] 获取店铺数据列表'
    method: GET
    path: /shop/shop/datalist
    data:
      shop_id: '3226'
    assert:
      code: 1
    extract: {}
    sign: true
- feature: 收银流程
  story: 收银流程
  tests:
  - id: open_table
    title: '[开台-正向] 开台'
    method: POST
    path: /cashier/order/store
    data:
      box_id: '{{ BOX_ID }}'
      billing_type: '20'
      goods_pricing_schemes_id: '7'
      box_pricing_schemes_id: '21'
      purchase_time: '480'
      shop_user_sales_id: ''
      shop_user_waiter_id: ''
      user_vip_id: ''
      sales_name: ''
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    special: websocket_open_table
    sign: true
  - id: add_goods
    title: '[点单-正向] 点单'
    method: POST
    path: /cashier/goodsorders/store
    data:
      box_id: '{{ BOX_ID }}'
      shop_user_sales_id: ''
      goods_array:
      - goods_id: 15
        goods_name: 国宾啤酒
        num: 2
        unit_name: 瓶
        unit_id: 38
        type: 1
      - goods_id: 16
        goods_name: 可乐
        num: 2
        unit_name: 听
        unit_id: 47
        type: 1
      desc: ''
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    special: add_goods_extract
    sign: true
  - id: goods_refund
    title: '[退品-正向] 退品'
    method: POST
    path: /cashier/order/goods_refund_save
    data:
      order_id: '{{ order_id }}'
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    special: goods_refund_param
    sign: true
  - id: give_order
    title: '[赠送-正向] 赠送商品'
    method: POST
    path: /cashier/goodsorders/store
    data:
      box_id: '{{ BOX_ID }}'
      give_id: '{{ GIVE_USER_ID }}'
      goods_array:
      - goods_id: 15
        goods_name: 国宾啤酒
        num: 1
        unit_name: 瓶
        unit_id: 38
        type: 1
      send_remark: ''
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    sign: true
  - id: good_settlement
    title: '[付款-正向] 单品结算'
    method: POST
    path: /cashier/orderpayments/goodSettlement
    data:
      box_id: '{{ BOX_ID }}'
      type: '0'
      payRemark: ''
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    special: settlement_param
    sign: true
  - id: set_settlement
    title: '[结账-正向] 整体结账'
    method: POST
    path: /cashier/orderpayments/setsettlement
    data:
      box_id: '{{ BOX_ID }}'
      type: '1'
      payRemark: ''
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    special: set_settlement_param
    sign: true
  - id: close_box
    title: '[关房-正向] 关房'
    method: POST
    path: /cashier/order/editboxstatus
    data:
      box_status: '50'
      box_id: '{{ BOX_ID }}'
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      msg: 成功
    extract: {}
    sign: true
- feature: 寄存支取
  story: 寄存支取
  tests:
  - id: store_wine
    title: '[寄存-正向] 寄存酒水'
    method: POST
    path: /cashier/storingwines/store
    data:
      user_type: '1'
      name: 自动化
      phone: '{{ USER_PHONE }}'
      day: '30'
      remark: ''
      shop_user_id: ''
      client_user_id: ''
      box_id: '{{ STORING_BOX_ID }}'
      goods_array:
      - goods_id: '16'
        num: '2'
        unit_id: '1'
        unit_num: '0'
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
      data: not_null
    extract:
      storing_wine_id: data.storing_wine_id
      deposit_data: data.deposit
      deposit_goods_id: data.deposit.[0].goods_id
      deposit_goods_num: data.deposit.[0].num
    sign: true
  - id: query_store_detail
    title: '[查询寄存-正向] 查询寄存明细'
    method: GET
    path: /cashier/storingwines/index
    data:
      storing_wines_id: '{{ storing_wine_id }}'
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
    extract: {}
    special: storing_query_extract
    sign: true
  - id: take_wine
    title: '[支取-正向] 支取酒水'
    method: POST
    path: /cashier/storingwines/takewine
    data:
      storing_wines_id: '{{ storing_wine_id }}'
      box_id: '{{ BOX_ID }}'
      wine_shop_id: '{{ SHOP_ID }}'
      takeWineBatch: '1'
      remark: ''
      is_custom: '2'
      shop_id: '{{ SHOP_ID }}'
    assert:
      code: 1
    extract: {}
    special: take_wine_param
    sign: true
